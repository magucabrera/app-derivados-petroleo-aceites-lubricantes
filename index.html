/* ---------------------------------------------------------
   LÓGICA DEL SIMULADOR — basada solo en el PDF
--------------------------------------------------------- */
function calcularResultado(sel) {
  const score = { mineral: 0, sintetico: 0, semisintetico: 0, vegetal: 0 };
  const razones = { mineral: [], sintetico: [], semisintetico: [], vegetal: [] };

  if (sel.temperatura === "normal") {
    score.mineral += 2; razones.mineral.push("brinda buena protección en condiciones normales de trabajo");
  }
  if (sel.temperatura === "alta" || sel.temperatura === "baja") {
    score.sintetico += 3; razones.sintetico.push("tiene mayor resistencia a temperaturas muy altas y muy bajas");
  }
  if (sel.temperatura === "alta") {
    score.vegetal -= 2;
  }

  if (sel.exigencia === "moderada") {
    score.mineral += 2; razones.mineral.push("se usa en equipos de uso moderado");
  }
  if (sel.exigencia === "media") {
    score.semisintetico += 3; razones.semisintetico.push("se utiliza en maquinaria de exigencia media");
  }
  if (sel.exigencia === "extrema") {
    score.sintetico += 3; razones.sintetico.push("es ideal para equipos que trabajan en condiciones extremas");
  }

  if (sel.costo === "bajo") {
    score.mineral += 3; razones.mineral.push("es el lubricante más utilizado por su bajo costo");
  }
  if (sel.costo === "intermedio") {
    score.semisintetico += 3; razones.semisintetico.push("es más económico que el sintético, con un costo intermedio");
  }
  if (sel.costo === "nopriordad") {
    score.sintetico += 2; razones.sintetico.push("el costo elevado no representa un problema en este caso");
  }

  if (sel.ambiental === "importante") {
    score.vegetal += 4; razones.vegetal.push("es biodegradable y genera un menor impacto ambiental");
  }

  const max = Math.max(score.mineral, score.sintetico, score.semisintetico, score.vegetal);
  if (max <= 0) return { empatados: [], razones, sinDatos: true };
  const ganadores = Object.keys(score).filter((k) => score[k] === max);
  return { empatados: ganadores, razones, sinDatos: false, score };
}

      >
        Probar el simulador <IconArrow size={16} />
      </button>

      {tipo && (
        <div
          className="fixed inset-0 z-40 flex items-end sm:items-center justify-center bg-black/60 backdrop-blur-sm px-0 sm:px-4"
          onClick={() => setAbierto(null)}
        >
          <div
            className="enter w-full sm:max-w-md bg-[var(--bg-elevated)] border border-[var(--border-light)] rounded-t-2xl sm:rounded-2xl p-5 pb-8 sm:pb-5 max-h-[80vh] overflow-y-auto"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="flex items-start justify-between mb-3">
              <div className="flex items-center gap-3">
                <span className="w-11 h-11 rounded-lg flex items-center justify-center brushed-metal border border-[var(--border-light)]">
                  <tipo.icon size={22} style={{ color: tipo.color }} />
                </span>
                <h3 className="font-display text-xl font-semibold text-[var(--text)]">{tipo.nombre}</h3>
              </div>
              <button onClick={() => setAbierto(null)} className="text-[var(--text-muted)] hover:text-[var(--text)] p-1">
                <IconClose size={20} />
              </button>
            </div>
            <ul className="space-y-2.5">
              {tipo.puntos.map((p, i) => (
                <li key={i} className="flex gap-2.5 text-[14px] leading-relaxed text-[var(--text)]/90">
                  <span className="mt-2 w-1.5 h-1.5 rounded-full flex-shrink-0" style={{ background: tipo.color }} />
                  {p}
                </li>
              ))}
            </ul>
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   PANTALLA 3 — SIMULADOR
--------------------------------------------------------- */
function OpcionPill({ activo, onClick, children }) {
  return (
    <button
      onClick={onClick}
      className={`press-btn px-3.5 py-2 rounded-full text-[13px] font-medium border ${
        activo
          ? "bg-[var(--green)] border-[var(--green)] text-[#0c100e]"
          : "border-[var(--border-light)] text-[var(--text)]/85 hover:border-[var(--metal)]"
      }`}
    >
      {children}
    </button>
  );
}

function GrupoSelector({ icon: Icon, label, opciones, valor, onChange }) {
  return (
    <div className="mb-5">
      <div className="flex items-center gap-2 mb-2 text-[var(--metal-light)]">
        <Icon size={17} />
        <span className="font-display text-[13.5px] font-medium">{label}</span>
      </div>
      <div className="flex flex-wrap gap-2">
        {opciones.map((op) => (
          <OpcionPill key={op.value} activo={valor === op.value} onClick={() => onChange(op.value)}>
            {op.label}
          </OpcionPill>
        ))}
      </div>
    </div>
  );
}

function PantallaSimulador() {
  const [sel, setSel] = useState({ temperatura: null, exigencia: null, costo: null, ambiental: null });
  const [resultado, setResultado] = useState(null);

  const completo = sel.temperatura && sel.exigencia && sel.costo && sel.ambiental;

  const elegir = () => {
    if (!completo) return;
    setResultado(calcularResultado(sel));
  };

  const reiniciar = () => {
    setSel({ temperatura: null, exigencia: null, costo: null, ambiental: null });
    setResultado(null);
  };

  return (
    <div className="enter px-5 pt-6 pb-4 max-w-2xl mx-auto">
      <p className="font-display text-xs tracking-wider text-[var(--gold)] mb-1">Guía del taller · 3 de 4</p>
      <h1 className="font-display text-2xl sm:text-3xl font-semibold text-[var(--text)]">¿Qué aceite elegir?</h1>
      <p className="mt-2 text-[15px] text-[var(--text-muted)] max-w-md">
        Elegí las condiciones de trabajo y descubrí qué tipo se ajusta mejor.
      </p>

      <div className="mt-6 rounded-xl border border-[var(--border)] bg-[var(--surface)] p-4 sm:p-5">
        <GrupoSelector
          icon={IconThermo} label="Temperatura"
          valor={sel.temperatura} onChange={(v) => setSel((s) => ({ ...s, temperatura: v }))}
          opciones={[
            { value: "normal", label: "Normal" },
            { value: "alta", label: "Muy alta" },
            { value: "baja", label: "Muy baja" },
          ]}
        />
        <GrupoSelector
          icon={IconGaugeMini} label="Exigencia del trabajo"
          valor={sel.exigencia} onChange={(v) => setSel((s) => ({ ...s, exigencia: v }))}
          opciones={[
            { value: "moderada", label: "Moderada" },
            { value: "media", label: "Media" },
            { value: "extrema", label: "Extrema" },
          ]}
        />
        <GrupoSelector
          icon={IconCoin} label="Costo"
          valor={sel.costo} onChange={(v) => setSel((s) => ({ ...s, costo: v }))}
          opciones={[
            { value: "bajo", label: "Bajo" },
            { value: "intermedio", label: "Intermedio" },
            { value: "nopriordad", label: "No es prioridad" },
          ]}
        />
        <div className="mb-1">
          <GrupoSelector
            icon={IconLeaf} label="Impacto ambiental"
            valor={sel.ambiental} onChange={(v) => setSel((s) => ({ ...s, ambiental: v }))}
            opciones={[
              { value: "importante", label: "Importante" },
              { value: "nopriordad", label: "No es prioridad" },
            ]}
          />
        </div>
      </div>

      <button
        onClick={elegir}
        disabled={!completo}
        className={`press-btn mt-5 w-full inline-flex items-center justify-center gap-2 rounded-lg font-display font-semibold text-[16px] px-5 py-3.5 ${
          completo
            ? "bg-[var(--gold)] hover:bg-[var(--gold-bright)] text-[#0c100e]"
            : "bg-[var(--surface-2)] text-[var(--text-muted)] cursor-not-allowed"
        }`}
      >
        Elegir aceite
      </button>

      {resultado && (
        <div className="enter mt-6">
          <h2 className="font-display text-lg font-medium text-[var(--text)] mb-3">Resultado</h2>

          {resultado.sinDatos ? (
            <div className="rounded-xl border border-[var(--border-light)] bg-[var(--surface)] p-4">
              <p className="text-[14px] text-[var(--text)]/90">
                Estas condiciones no coinciden claramente con las características de un tipo específico
                según la información disponible. Probá cambiando alguna de las opciones.
              </p>
            </div>
          ) : resultado.empatados.length > 1 ? (
            <div className="rounded-xl border border-[var(--gold)]/50 bg-[var(--surface)] p-4">
              <p className="font-display text-[15px] text-[var(--gold-bright)] mb-2">
                Estas condiciones pueden corresponder a más de un tipo de aceite.
              </p>
              <div className="space-y-3 mt-3">
                {resultado.empatados.map((k) => (
                  <div key={k} className="pl-3 border-l-2" style={{ borderColor: "var(--gold)" }}>
                    <p className="font-display text-[14px] font-medium text-[var(--text)]">{NOMBRE_TIPO[k]}</p>
                    <ul className="mt-1 space-y-1">
                      {resultado.razones[k].map((r, i) => (
                        <li key={i} className="text-[13px] text-[var(--text-muted)]">— {r}</li>
                      ))}
                    </ul>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="rounded-xl border border-[var(--green-bright)]/50 bg-[var(--green-dim)] p-4">
              <div className="flex items-center gap-2.5 mb-2">
                {React.createElement(TIPOS.find(t => t.id === resultado.empatados[0]).icon, { size: 20, style: { color: "var(--green-bright)" } })}
                <p className="font-display text-lg font-semibold text-[var(--green-bright)]">
                  {NOMBRE_TIPO[resultado.empatados[0]]}
                </p>
              </div>
              <p className="text-[13px] text-[var(--metal-light)] mb-2 font-display tracking-wide">Coincide porque:</p>
              <ul className="space-y-1.5">
                {resultado.razones[resultado.empatados[0]].map((r, i) => (
                  <li key={i} className="text-[13.5px] text-[var(--text)]/90 flex gap-2">
                    <IconCheck size={15} className="text-[var(--green-bright)] flex-shrink-0 mt-0.5" />
                    {r}
                  </li>
                ))}
              </ul>
            </div>
          )}

          <button
            onClick={reiniciar}
            className="press-btn mt-4 text-[13.5px] font-medium text-[var(--text-muted)] hover:text-[var(--text)] underline underline-offset-4"
          >
            Probar otra combinación
          </button>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   PANTALLA 4 — DESAFÍO
--------------------------------------------------------- */
function PantallaDesafio() {
  const [idx, setIdx] = useState(0);
  const [elegida, setElegida] = useState(null);
  const [score, setScore] = useState(0);
  const [terminado, setTerminado] = useState(false);

  const pregunta = PREGUNTAS[idx];

  const responder = (i) => {
    if (elegida !== null) return;
    setElegida(i);
    if (i === pregunta.correcta) setScore((s) => s + 1);
  };

  const siguiente = () => {
    if (idx + 1 >= PREGUNTAS.length) {
      setTerminado(true);
    } else {
      setIdx((n) => n + 1);
      setElegida(null);
    }
  };

  const reiniciar = () => {
    setIdx(0); setElegida(null); setScore(0); setTerminado(false);
  };

  if (terminado) {
    return (
      <div className="enter px-5 pt-10 pb-4 max-w-md mx-auto text-center">
        <p className="font-display text-xs tracking-wider text-[var(--gold)] mb-1">Guía del taller · 4 de 4</p>
        <div className="mx-auto w-16 h-16 rounded-full brushed-metal border border-[var(--border-light)] flex items-center justify-center mb-5 mt-4">
          <IconBrain size={28} className="text-[var(--gold-bright)]" />
        </div>
        <h1 className="font-display text-2xl font-semibold text-[var(--text)]">Desafío completado</h1>
        <p className="mt-3 font-display text-4xl font-bold" style={{ color: score >= 4 ? "var(--green-bright)" : "var(--gold-bright)" }}>
          {score}/{PREGUNTAS.length}
        </p>
        <p className="mt-1 text-[14px] text-[var(--text-muted)]">respuestas correctas</p>
        <button
          onClick={reiniciar}
          className="press-btn mt-7 inline-flex items-center gap-2 rounded-lg bg-[var(--green)] hover:bg-[var(--green-bright)] text-[#0c100e] font-display font-semibold text-[15px] px-6 py-3"
        >
          Volver a intentar
        </button>
      </div>
    );
  }

  return (
    <div className="enter px-5 pt-6 pb-4 max-w-lg mx-auto">
      <p className="font-display text-xs tracking-wider text-[var(--gold)] mb-1">Guía del taller · 4 de 4</p>
      <div className="flex items-center justify-between mb-4">
        <h1 className="font-display text-2xl font-semibold text-[var(--text)]">Desafío</h1>
        <span className="text-[12.5px] font-display text-[var(--text-muted)]">Pregunta {idx + 1} / {PREGUNTAS.length}</span>
      </div>

      <div className="w-full h-1.5 rounded-full bg-[var(--surface-2)] overflow-hidden mb-6">
        <div className="h-full bg-[var(--gold)] transition-all duration-300" style={{ width: `${((idx) / PREGUNTAS.length) * 100}%` }} />
      </div>

      <div className="rounded-xl border border-[var(--border)] bg-[var(--surface)] p-5">
        <p className="font-display text-[16px] font-medium text-[var(--text)] leading-snug">{pregunta.q}</p>

        <div className="mt-4 space-y-2.5">
          {pregunta.opciones.map((op, i) => {
            const esCorrecta = i === pregunta.correcta;
            const esElegida = i === elegida;
            let estilo = "border-[var(--border-light)] text-[var(--text)]/90 hover:border-[var(--metal)]";
            if (elegida !== null) {
              if (esCorrecta) estilo = "border-[var(--green-bright)] bg-[var(--green-dim)] text-[var(--green-bright)]";
              else if (esElegida) estilo = "border-[var(--danger)] bg-[var(--danger-dim)] text-[var(--danger)]";
              else estilo = "border-[var(--border)] text-[var(--text-muted)] opacity-60";
            }
            return (
              <button
                key={i}
                onClick={() => responder(i)}
                disabled={elegida !== null}
                className={`card-select w-full flex items-center justify-between text-left rounded-lg border px-4 py-3 text-[14px] ${estilo}`}
              >
                <span>{op}</span>
                {elegida !== null && esCorrecta && <IconCheck size={17} />}
                {elegida !== null && esElegida && !esCorrecta && <IconX size={17} />}
              </button>
            );
          })}
        </div>

        {elegida !== null && (
          <button
            onClick={siguiente}
            className="press-btn mt-5 w-full inline-flex items-center justify-center gap-2 rounded-lg bg-[var(--gold)] hover:bg-[var(--gold-bright)] text-[#0c100e] font-display font-semibold text-[15px] px-5 py-3"
          >
            {idx + 1 >= PREGUNTAS.length ? "Ver resultado" : "Siguiente"} <IconArrow size={15} />
          </button>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   NAVEGACIÓN INFERIOR
--------------------------------------------------------- */
function NavItem({ active, onClick, icon: Icon, label }) {
  return (
    <button
      onClick={onClick}
      className="press-btn flex-1 flex flex-col items-center justify-center gap-1 py-2.5"
    >
      <Icon size={21} className={active ? "text-[var(--green-bright)]" : "text-[var(--text-muted)]"} />
      <span className={`font-display text-[10.5px] tracking-wide ${active ? "text-[var(--green-bright)] font-medium" : "text-[var(--text-muted)]"}`}>
        {label}
      </span>
      {active && <span className="w-1 h-1 rounded-full bg-[var(--green-bright)] mt-0.5" />}
    </button>
  );
}

function BottomNav({ tab, setTab }) {
  const items = [
    { id: "funciones", label: "Funciones", icon: IconGear },
    { id: "tipos", label: "Tipos", icon: IconDrop },
    { id: "simulador", label: "Simulador", icon: IconFlask },
    { id: "desafio", label: "Desafío", icon: IconBrain },
  ];
  return (
    <nav className="fixed bottom-0 inset-x-0 z-30 border-t border-[var(--border)] bg-[var(--bg-elevated)]/95 backdrop-blur-sm">
      <div className="max-w-2xl mx-auto flex">
        {items.map((it) => (
          <NavItem key={it.id} active={tab === it.id} onClick={() => setTab(it.id)} icon={it.icon} label={it.label} />
        ))}
      </div>
    </nav>
  );
}

/* ---------------------------------------------------------
   APP
--------------------------------------------------------- */
function App() {
  const [tab, setTab] = useState("funciones");

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, [tab]);

  return (
    <div className="min-h-screen pb-24">
      {tab === "funciones" && <PantallaFunciones onIrATipos={() => setTab("tipos")} />}
      {tab === "tipos" && <PantallaTipos onIrASimulador={() => setTab("simulador")} />}
      {tab === "simulador" && <PantallaSimulador />}
      {tab === "desafio" && <PantallaDesafio />}
      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
